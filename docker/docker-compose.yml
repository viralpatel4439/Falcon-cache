# A single Falcon Cache node.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   curl localhost:8080/healthz
#
# The image already bakes a working profile, so no command override is needed —
# `falcon serve` is the image's default. Uncomment the `command` block below
# only if you want to change settings without rebuilding.
services:
  cache:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: falcon-cache:latest
    container_name: falcon-cache
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP / REST
      - "6380:6380"   # binary wire protocol

    # The cache is pure RAM and sizes itself to this limit — it takes a share
    # of it and leaves headroom, so it evicts rather than being OOM-killed.
    # This one line is the memory configuration; there is no capacity setting
    # to keep in sync with it.
    mem_limit: 512m

    # Compose does not read the image's HEALTHCHECK, so it is repeated here to
    # make `docker compose ps` report health.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

    # Falcon is configured through its CLI, never env vars. To change settings,
    # run `config set` before `serve` — these are idempotent, so restarts are
    # safe.
    #
    # command: >
    #   sh -c "falcon config set node.id cache-1 &&
    #          falcon config set region us-east-1 &&
    #          falcon config set api-key change-me &&
    #          falcon serve"
    # entrypoint: [""]
